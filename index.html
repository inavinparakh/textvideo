<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Poster Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e1e4e8;
        }
        .header {
            background: #1a365d;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 14px;
            color: #cbd5e0;
        }
        .poster-body {
            padding: 24px;
            text-align: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2b6cb0;
            margin: 0 auto 16px auto;
            display: block;
            background-color: #edf2f7;
        }
        .agent-name {
            font-size: 22px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 6px;
        }
        .tagline {
            font-size: 15px;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .experience-badge {
            display: inline-block;
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #bee3f8;
        }
        .upload-section {
            background: #f7fafc;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .upload-section label {
            display: block;
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .upload-section input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: #4a5568;
        }
        .branding-footer {
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-img {
            height: 35px;
            max-width: 120px;
            object-fit: contain;
        }
        .contact-info {
            font-size: 12px;
            color: #718096;
            text-align: right;
        }
        .btn-generate {
            width: 100%;
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-generate:hover {
            background: #2c5282;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Insurance Advisory Services</h1>
        <p>विश्वास आणि सुरक्षेचे ब्रीद</p>
    </div>

    <div class="poster-body">
        <!-- फोटो: GitHub रिपॉझिटरीमधील फोटोचा पाथ किंवा लिंक द्या -->
        <img src="photo.jpg" alt="Agent Photo" class="profile-img" onerror="this.src='https://via.placeholder.com/110'">
        
        <div class="agent-name">नविन पारख</div>
        <div class="tagline">Insurance Consultant</div>
        <div class="experience-badge">१९ वर्षांपासून आपल्या सेवेत</div>

        <div class="upload-section">
            <label for="pdfUpload">पीडीएफ (PDF) फाइल निवडा:</label>
            <input type="file" id="pdfUpload" accept="application/pdf">
            <button class="btn-generate" onclick="generatePoster()">पोस्टर तयार करा</button>
        </div>

        <div class="branding-footer">
            <!-- लोगो: GitHub रिपॉझिटरीमधील लोगोचा पाथ किंवा लिंक द्या -->
            <img src="logo.png" alt="Company Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="contact-info">
                <div>अधिक माहितीसाठी संपर्क करा</div>
                <div>All Life & General Insurance</div>
            </div>
        </div>
    </div>
</div>

<script>
    function generatePoster() {
        const fileInput = document.getElementById('pdfUpload');
        if (fileInput.files.length === 0) {
            alert('कृपया आधी एक PDF फाइल निवडा.');
            return;
        }
        alert('फाइल निवडली गेली आहे: ' + fileInput.files[0].name);
        // पुढील PDF प्रक्रिया किंवा एक्सट्रॅक्शन लॉजिक येथे जोडता येईल
    }
</script>

</body>
</html>
